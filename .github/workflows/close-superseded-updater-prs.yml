name: Close Superseded Updater PRs

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report which PRs would be closed'
        type: boolean
        default: true
      merged_pr:
        description: 'Merged updater PR number to use as the cutoff (optional; if empty, matching open PRs are only listed)'
        type: string
        required: false

jobs:
  close-superseded:
    permissions:
      contents: read
      pull-requests: write
    # Other repos: uses: scottbilas/OkTools/.github/workflows/reusable-close-superseded-updater-prs.yml@dev
    uses: ./.github/workflows/reusable-close-superseded-updater-prs.yml
    with:
      dry_run: ${{ inputs.dry_run == true }}
      merged_pr: ${{ inputs.merged_pr }}
