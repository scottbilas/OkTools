name: Close Superseded Updater PRs

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report which PRs would be closed'
        type: boolean
        default: true
      merged_pr:
        description: 'Merged updater PR number to use as the cutoff (optional; if empty, matching open PRs are only listed)'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  close-superseded:
    # Pre-filter on the event payload; the script re-validates every field before closing anything.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.title == 'Update GitHub Action Versions' &&
       startsWith(github.event.pull_request.head.ref, 'gh-actions-update-') &&
       contains(github.event.pull_request.body, '### GitHub Actions Version Updates'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Close superseded updater PRs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          MERGED_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_pr || github.event.pull_request.number }}
          MERGED_PR_MERGED: ${{ github.event.pull_request.merged }}
          MERGED_PR_TITLE: ${{ github.event.pull_request.title }}
          MERGED_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGED_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          MERGED_PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/close-superseded-updater-prs.sh
